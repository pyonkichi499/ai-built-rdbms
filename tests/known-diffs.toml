[[kd]]
id = "KD-21"
kind = "unsupported"
title = "COPY のバイナリ形式は M6。COPY ... TO STDOUT と CSV は XQ-6 が入るまで 0A000"
chapter = "04-extended-query"
since = "M5"
until = "M6"
pattern = '\bCOPY\b[^;]*\bTO\s+STDOUT\b|\bCOPY\b[^;]*\bFORMAT\s+(binary|csv)\b|\bCOPY\b[^;]*\bBINARY\b|\bCOPY\b[^;]*\bCSV\b'
questions = ["M5-Q2"]
note = "ドライバの C7 の copy_in / copy_out は XQ-6 が入るまで失敗を期待する。XQ-6 が入れば解消（その場合は pattern を外す）"

[[kd]]
id = "KD-22"
kind = "unsupported"
title = "DECLARE CURSOR / FETCH / MOVE / CLOSE がない"
chapter = "00-contracts"
since = "M5"
until = "M6"
pattern = '^\s*DECLARE\s+\S+\s+(\w+\s+)*CURSOR\b|^\s*FETCH\s+(NEXT|PRIOR|FIRST|LAST|ALL|FORWARD|BACKWARD|ABSOLUTE|RELATIVE|\d+|FROM|IN)\b|^\s*MOVE\s+(NEXT|PRIOR|FIRST|LAST|ALL|FORWARD|BACKWARD|ABSOLUTE|RELATIVE|\d+|FROM|IN)\b'
note = "psycopg 3 の名前つきカーソル、pgJDBC の Extended を使わない setFetchSize 以外のカーソルが使えない。ドライバの C6 の psycopg 側は失敗を期待する"

[[kd]]
