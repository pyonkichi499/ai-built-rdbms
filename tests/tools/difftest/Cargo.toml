[package]
name = "difftest"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Differential tester: compares a yuzhu server against a reference PostgreSQL over the wire protocol"

# 独立した Cargo プロジェクト（impl/rust のワークスペースには属さない）。
[workspace]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
postgres = "0.19"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
