[package]
name = "yuzhu-isolation"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "PostgreSQL isolationtester-compatible spec runner (Simple Query protocol only)"

# impl/rust のワークスペースには入れない独立プロジェクト。
[workspace]

[[bin]]
name = "yuzhu-isolation"
path = "src/main.rs"

[dependencies]
# ワイヤプロトコルのメッセージ符号化・認証（MD5 / SCRAM）だけを借りる。
# 送受信ループ・結果の組み立ては src/conn.rs に手書きする（libpq の PQsendQuery /
# PQisBusy / PQgetResult と同じ粒度で制御するため）。
postgres-protocol = "0.6"
bytes = "1"
fallible-iterator = "0.2"
clap = { version = "4", features = ["derive", "env"] }
similar = "2"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
