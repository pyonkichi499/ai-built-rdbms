# 方式の組み合わせと先勝ち。bob は全部拒否、app への接続は scram、other への alice は password、残りは trust。
local all     all                        trust
host  all     bob    127.0.0.1/32        reject
host  app     all    127.0.0.1/32        scram-sha-256
host  other   alice  127.0.0.1/32        password
host  all     all    127.0.0.1/32        trust
host  all     all    127.0.0.2/32        reject
