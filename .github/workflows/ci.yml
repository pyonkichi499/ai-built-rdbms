name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/rust
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  # slt の lint（サーバ不要）。tests/tools/slttools（11-tests-plan.md §3.2.5）。
  slt-lint:
    name: SLT lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/tools/slttools
      - name: Build slttools
        run: cargo build --release --manifest-path tests/tools/slttools/Cargo.toml
      - name: slttools lint (tests/slt, tests/restart)
        run: tests/tools/slttools/target/release/slttools lint
      - name: consistency.slt.part が各コピーと一致する
        run: tests/tools/slttools/target/release/slttools consistency --check

  # 共有 sqllogictest スイートの期待値が、本物の PostgreSQL 17 で正しいことを確かめる。
  slt-pg:
    name: SLT on PostgreSQL 17 (expected values)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: tzdata がある（Asia/Tokyo などを使う日時のテストの前提）
        run: test -d /usr/share/zoneinfo/Asia
      - name: Cache sqllogictest-bin
        id: slt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqllogictest
          key: sqllogictest-bin-0.29.1-${{ runner.os }}
      - name: Install sqllogictest-bin 0.29.1
        if: steps.slt-cache.outputs.cache-hit != 'true'
        # --locked は必須（tokio-postgres 0.7.12 を使うため。spec/research/research-slt.md 参照）
        run: cargo install sqllogictest-bin --locked --version 0.29.1
      - name: Run tests/slt against PostgreSQL
        # m1〜m4。最後に m4/z_final（no_leftovers は専用の空の PostgreSQL が前提）
        run: tests/run.sh --target pg --host 127.0.0.1 --port 55432

  # yuzhu-server に対して共有スイートを流す。
  slt-yuzhu:
    name: SLT on yuzhu-server
    runs-on: ubuntu-latest
    # フェーズ 4（11 §4.4）から外す（D11-9）。M4 の完了判定はローカルの tests/done-check.sh。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/rust
      - name: Cache sqllogictest-bin
        id: slt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqllogictest
          key: sqllogictest-bin-0.29.1-${{ runner.os }}
      - name: Install sqllogictest-bin 0.29.1
        if: steps.slt-cache.outputs.cache-hit != 'true'
        run: cargo install sqllogictest-bin --locked --version 0.29.1
      - name: Build yuzhu-server
        working-directory: impl/rust
        run: cargo build --release -p yuzhu-server
      - name: Start yuzhu-server
        run: |
          impl/rust/target/release/yuzhu-server --listen 127.0.0.1 --port 5433 > yuzhu-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/5433) 2>/dev/null; then echo "yuzhu-server is up"; exit 0; fi
            sleep 0.5
          done
          echo "yuzhu-server did not start" >&2
          cat yuzhu-server.log >&2
          exit 1
      - name: Run tests/slt against yuzhu-server
        # tests/slt の m1〜m4 を流す（m3/txn/savepoint_unsupported.slt は yuzhu 専用）
        run: tests/run.sh --target yuzhu --host 127.0.0.1 --port 5433
      - name: Show yuzhu-server log
        if: always()
        run: cat yuzhu-server.log || true

  # Docker イメージがビルドでき、起動して 5432 を listen することを確かめる（push はしない）。
  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: yuzhu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (TCP listen)
        run: |
          docker run -d --name yuzhu-smoke -p 55432:5432 yuzhu:ci
          for _ in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/55432) 2>/dev/null; then echo "yuzhu-server is up"; docker rm -f yuzhu-smoke; exit 0; fi
            sleep 0.5
          done
          echo "yuzhu-server did not start" >&2
          docker logs yuzhu-smoke >&2
          docker rm -f yuzhu-smoke
          exit 1

  # M3: クラッシュをまたぐ再起動テスト（tests/restart の全シナリオ。m3 は kill -9 のクラッシュを含む）。
  restart-pg:
    name: Restart/crash tests on PostgreSQL 17 (expected values)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache sqllogictest-bin
        id: slt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqllogictest
          key: sqllogictest-bin-0.29.1-${{ runner.os }}
      - name: Install sqllogictest-bin 0.29.1
        if: steps.slt-cache.outputs.cache-hit != 'true'
        run: cargo install sqllogictest-bin --locked --version 0.29.1
      - name: Start PostgreSQL 17
        run: tests/pg.sh start
      - name: Restart tests (tests/restart と tests/restart/m4 の restart / both)
        run: tests/run.sh --target pg --restart --port 55432
      - name: Crash tests (tests/restart/m3 と tests/restart/m4 の crash / both / mixed)
        run: tests/run.sh --target pg --crash --port 55432
      - name: Stop PostgreSQL
        if: always()
        run: tests/pg.sh stop

  restart-yuzhu:
    name: Restart/crash tests on yuzhu-server
    runs-on: ubuntu-latest
    # フェーズ 4 から外す（D11-9）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/rust
      - name: Cache sqllogictest-bin
        id: slt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqllogictest
          key: sqllogictest-bin-0.29.1-${{ runner.os }}
      - name: Install sqllogictest-bin 0.29.1
        if: steps.slt-cache.outputs.cache-hit != 'true'
        run: cargo install sqllogictest-bin --locked --version 0.29.1
      - name: Build yuzhu-server and yuzhu-initdb
        working-directory: impl/rust
        run: cargo build --release -p yuzhu-server
      - name: Start yuzhu-server
        run: tests/yuzhu.sh start --port 5433
      - name: Restart tests (tests/restart と tests/restart/m4 の restart / both)
        run: tests/run.sh --target yuzhu --restart --port 5433
      - name: Crash tests (tests/restart/m3 と tests/restart/m4 の crash / both / mixed)
        run: tests/run.sh --target yuzhu --crash --port 5433
      - name: Stop yuzhu-server
        if: always()
        run: tests/yuzhu.sh clean

  # M3・M4: isolationtester 互換の spec（tests/isolation/specs。M3 の 6 本 + M4 の index-*、seq-nonblocking）。PostgreSQL で期待値を確かめ、yuzhu でも流す。
  isolation:
    name: Isolation tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.target == 'yuzhu' }}
    strategy:
      fail-fast: false
      matrix:
        target: [pg, yuzhu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            impl/rust
            tests/tools/isolation
      - name: Build yuzhu-isolation
        run: cargo build --release --manifest-path tests/tools/isolation/Cargo.toml
      - name: Run against PostgreSQL 17
        if: matrix.target == 'pg'
        run: |
          tests/pg.sh start
          tests/tools/isolation/target/release/yuzhu-isolation --port 55432 tests/isolation/specs
          tests/pg.sh stop
      - name: Run against yuzhu-server
        if: matrix.target == 'yuzhu'
        run: |
          (cd impl/rust && cargo build --release -p yuzhu-server)
          tests/yuzhu.sh start --port 5433
          tests/tools/isolation/target/release/yuzhu-isolation --port 5433 --blocking-detection timeout --variant yuzhu-m3 tests/isolation/specs
          tests/yuzhu.sh clean

  # M3: クラッシュ試験 層 1（SimVfs。固定シード。長時間のランダム実行は #[ignore] で夜間ジョブ）。
  crash-sim:
    name: Crash simulation (layer 1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/rust
      - name: cargo test (crash_sim)
        run: cargo test --release -p yuzhu-core --test crash_sim

  # M4: 周辺ツール互換（psql 17 の \dt など、COPY、pgbench）。tests/compat/run.sh ができるまでは何もしない。
  compat:
    name: Compat tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.target == 'yuzhu' }}
    strategy:
      fail-fast: false
      matrix:
        target: [pg, yuzhu]
    steps:
      - uses: actions/checkout@v4
      - name: tests/compat/run.sh の有無
        id: has
        run: |
          if [ -x tests/compat/run.sh ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.has.outputs.present == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.has.outputs.present == 'true'
        with:
          workspaces: impl/rust
      - name: Install PostgreSQL 17 client (psql / pgbench。PGDG)
        if: steps.has.outputs.present == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17 postgresql-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Run tests/compat/run.sh
        if: steps.has.outputs.present == 'true'
        run: |
          if [ "${{ matrix.target }}" = yuzhu ]; then (cd impl/rust && cargo build --release -p yuzhu-server); fi
          tests/compat/run.sh --target ${{ matrix.target }}
