name: Nightly

# 夜間ジョブ（参考。失敗は issue 化する。M4 の完了判定は tests/done-check.sh のローカル実行 = 11-tests-plan.md §1.3）。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 層 1 の長時間ランダム実行・proptest 8192 ケースなど（#[ignore] のテスト）
  rust-long:
    name: Rust long-running tests (#[ignore])
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/rust
      - name: cargo test -- --ignored
        run: cargo test --release --workspace -- --ignored

  # 完了判定のスクリプトそのもの（pg と yuzhu、全条件）
  done-check:
    name: tests/done-check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            impl/rust
            tests/tools/slttools
            tests/tools/isolation
            tests/tools/difftest
      - name: Install sqllogictest-bin 0.29.1
        run: cargo install sqllogictest-bin --locked --version 0.29.1
      - name: Install PostgreSQL 17 (server / client)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: tests/done-check.sh
        run: tests/done-check.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: done-check-logs
          path: /tmp/yuzhu-done-check
